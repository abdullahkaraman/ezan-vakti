<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Ezan Vakti</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main id="times">
      <header>
        <h1 id="location">Konum seçilmedi</h1>
        <button id="change" type="button">Konumu değiştir</button>
      </header>
      <section class="countdown" aria-live="polite">
        <span id="next"></span>
        <strong id="remaining">—</strong>
      </section>
      <ol id="rows"></ol>
      <p id="zone" class="note"></p>
      <p id="error" class="error" hidden></p>
      <p id="update" class="banner" hidden>
        <span id="update-text"></span>
        <button id="install" type="button">Güncelle</button>
      </p>
      <footer>
        <button id="open-reminders" type="button">Bildirimler</button>
        <span id="version" class="note"></span>
      </footer>
    </main>

    <form id="reminders" hidden>
      <h1>Vakit çıkmadan haber ver</h1>
      <div id="reminder-rows"></div>
      <p id="reminder-error" class="error" hidden></p>
      <p class="note">Bildirim gelmiyorsa sistem ayarlarından Ezan Vakti'ye izin ver.</p>
      <div class="actions">
        <button id="test" type="button">Dene</button>
        <button id="close-reminders" type="button" class="primary">Tamam</button>
      </div>
    </form>

    <form id="picker" hidden>
      <h1>Konum seç</h1>
      <label>Ülke <select id="country" required></select></label>
      <label>Şehir <select id="city" required></select></label>
      <label>İlçe <select id="district" required></select></label>
      <p id="picker-error" class="error" hidden></p>
      <div class="actions">
        <button id="cancel" type="button">Vazgeç</button>
        <button id="save" type="submit" class="primary">Kaydet</button>
      </div>
    </form>
  </body>
</html>
